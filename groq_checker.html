<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Model Checker</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; background: #f9f9f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        input[type="text"] { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #f55036; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d9422a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .model-card { background: #f1f5f9; padding: 1rem; border-radius: 6px; border: 1px solid #e2e8f0; }
        .model-card h3 { margin: 0 0 0.5rem 0; font-size: 1rem; color: #1e293b; word-break: break-all; }
        .model-card p { margin: 0; font-size: 0.875rem; color: #64748b; }
        .active { color: #10b981; font-weight: bold; font-size: 0.8rem;}
        #error { color: #ef4444; margin-top: 1rem; font-weight: bold; }
        #loading { display: none; margin-top: 1rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Groq Active Models Checker</h1>
        <p>Enter your Groq API Key to fetch the currently available and active models for your account.</p>
        
        <label for="apiKey">Groq API Key (gsk_...)</label>
        <input type="text" id="apiKey" placeholder="gsk_..." autocomplete="off">
        
        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <button onclick="fetchModels()" style="flex: 1;">List All Models</button>
        </div>

        <div style="border-top: 1px solid #e2e8f0; padding-top: 1rem; margin-top: 1rem;">
            <label for="modelId">Check Specific Model (optional)</label>
            <div style="display: flex; gap: 1rem;">
                <input type="text" id="modelId" placeholder="e.g. llama-3.1-8b-instant" autocomplete="off" style="margin-bottom: 0;">
                <button onclick="checkSpecificModel()" style="background: #3b82f6;">Check Model</button>
            </div>
        </div>
        
        <div id="loading">Fetching from Groq...</div>
        <div id="error"></div>
        
        <div class="grid" id="results"></div>
    </div>

    <script>
        function renderModelCard(model) {
            const card = document.createElement('div');
            card.className = 'model-card';
            const date = new Date(model.created * 1000).toLocaleDateString();
            card.innerHTML = `
                <h3>${model.id}</h3>
                <p>Owner: ${model.owned_by}</p>
                <p>Created: ${date}</p>
                <p class="active">● Available</p>
            `;
            return card;
        }

        async function fetchModels() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const resultsDiv = document.getElementById('results');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            
            errorDiv.textContent = '';
            resultsDiv.innerHTML = '';
            
            if (!apiKey) {
                errorDiv.textContent = 'Please enter an API key first.';
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('https://api.groq.com/openai/v1/models', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(`Error ${response.status}: ${err.error?.message || response.statusText}`);
                }

                const data = await response.json();
                loadingDiv.style.display = 'none';

                if (data && data.data && data.data.length > 0) {
                    data.data.sort((a, b) => b.created - a.created).forEach(model => {
                        resultsDiv.appendChild(renderModelCard(model));
                    });
                } else {
                    errorDiv.textContent = 'No models found for this account.';
                }

            } catch (err) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = err.message;
            }
        }

        async function checkSpecificModel() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelId = document.getElementById('modelId').value.trim();
            const resultsDiv = document.getElementById('results');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            
            errorDiv.textContent = '';
            resultsDiv.innerHTML = '';
            
            if (!apiKey) {
                errorDiv.textContent = 'Please enter an API key first.';
                return;
            }

            if (!modelId) {
                errorDiv.textContent = 'Please enter a Model ID to check.';
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const response = await fetch(`https://api.groq.com/openai/v1/models/${modelId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json().catch(() => ({}));
                loadingDiv.style.display = 'none';

                if (response.ok && data) {
                    resultsDiv.appendChild(renderModelCard(data));
                } else {
                    errorDiv.textContent = `Error ${response.status}: ${data.error?.message || 'Model not found or access denied.'}`;
                }

            } catch (err) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = err.message;
            }
        }
    </script>
</body>
</html>
